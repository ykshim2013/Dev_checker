<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developmental Milestone Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Developmental Milestone Checker</h1>
            <p class="subtitle">Track your child's developmental progress</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" data-tab="age-lookup">Age → Milestones</button>
            <button class="tab-button" data-tab="milestone-lookup">Milestone → Age</button>
        </div>

        <div id="age-lookup" class="tab-content active">
            <div class="input-section">
            <div class="input-group">
                <label for="age-input">Enter Age:</label>
                <input type="number" id="age-input" min="0" max="240" placeholder="Enter age" />
            </div>

            <div class="input-group">
                <label for="unit-select">Unit:</label>
                <select id="unit-select">
                    <option value="months">Months</option>
                    <option value="years">Years</option>
                </select>
            </div>

            <button id="check-btn" class="check-button">Check Milestones</button>
        </div>

            <div id="results" class="results-section"></div>
        </div>

        <div id="milestone-lookup" class="tab-content">
            <div class="input-section">
                <div class="input-group full-width">
                    <label for="milestone-input">Search Milestone:</label>
                    <input type="text" id="milestone-input" placeholder="e.g., independent sitting, walks alone" />
                    <div id="milestone-suggestions" class="suggestions"></div>
                </div>

                <div class="input-group">
                    <label for="achieved-age">Age Achieved (optional):</label>
                    <input type="number" id="achieved-age" min="0" max="240" placeholder="Enter age" />
                </div>

                <div class="input-group">
                    <label for="achieved-unit">Unit:</label>
                    <select id="achieved-unit">
                        <option value="months">Months</option>
                        <option value="years">Years</option>
                    </select>
                </div>

                <button id="check-milestone-btn" class="check-button">Check Milestone</button>
            </div>

            <div id="milestone-results" class="results-section"></div>
        </div>

        <footer>
            <p class="disclaimer">
                <strong>Disclaimer:</strong> This tool provides general developmental milestones.
                Every child develops at their own pace. Consult a healthcare professional for personalized guidance.
            </p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
