<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developmental Milestone Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="language-selector">
                <button class="lang-btn active" data-lang="en">English</button>
                <button class="lang-btn" data-lang="ko">한국어</button>
                <button class="lang-btn" data-lang="ru">Русский</button>
            </div>
            <h1 data-i18n="title">Developmental Milestone Checker</h1>
            <p class="subtitle" data-i18n="subtitle">Track your child's developmental progress</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" data-tab="age-lookup" data-i18n="tab-age-to-milestones">Age → Milestones</button>
            <button class="tab-button" data-tab="milestone-lookup" data-i18n="tab-milestone-to-age">Milestone → Age</button>
        </div>

        <div id="age-lookup" class="tab-content active">
            <div class="input-section">
            <div class="input-group">
                <label for="age-input" data-i18n="label-enter-age">Enter Age:</label>
                <input type="number" id="age-input" min="0" max="240" data-i18n-placeholder="placeholder-age" placeholder="Enter age" />
            </div>

            <div class="input-group">
                <label for="unit-select" data-i18n="label-unit">Unit:</label>
                <select id="unit-select">
                    <option value="months" data-i18n="option-months">Months</option>
                    <option value="years" data-i18n="option-years">Years</option>
                </select>
            </div>

            <button id="check-btn" class="check-button" data-i18n="btn-check-milestones">Check Milestones</button>
        </div>

            <div id="results" class="results-section"></div>
        </div>

        <div id="milestone-lookup" class="tab-content">
            <div class="input-section">
                <div class="input-group full-width">
                    <label for="milestone-input" data-i18n="label-search-milestone">Search Milestone:</label>
                    <input type="text" id="milestone-input" data-i18n-placeholder="placeholder-milestone" placeholder="e.g., independent sitting, walks alone" />
                    <div id="milestone-suggestions" class="suggestions"></div>
                </div>

                <div class="input-group">
                    <label for="achieved-age" data-i18n="label-age-achieved">Age Achieved (optional):</label>
                    <input type="number" id="achieved-age" min="0" max="240" data-i18n-placeholder="placeholder-age" placeholder="Enter age" />
                </div>

                <div class="input-group">
                    <label for="achieved-unit" data-i18n="label-unit">Unit:</label>
                    <select id="achieved-unit">
                        <option value="months" data-i18n="option-months">Months</option>
                        <option value="years" data-i18n="option-years">Years</option>
                    </select>
                </div>

                <button id="check-milestone-btn" class="check-button" data-i18n="btn-check-milestone">Check Milestone</button>
            </div>

            <div id="milestone-results" class="results-section"></div>
        </div>

        <footer>
            <p class="disclaimer">
                <strong data-i18n="disclaimer-title">Disclaimer:</strong> <span data-i18n="disclaimer-text">This tool provides general developmental milestones. Every child develops at their own pace. Consult a healthcare professional for personalized guidance.</span>
            </p>
        </footer>
    </div>

    <script src="translations.js"></script>
    <script src="script.js"></script>
</body>
</html>
